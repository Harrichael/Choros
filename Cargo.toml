[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
choros-core = { path = "crates/choros-core" }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ignore = "0.4.33"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.140"
tempfile = "3.27.0"
time = { version = "0.3.47", features = ["formatting", "local-offset", "macros", "parsing"] }
toml = "1.1.2"
