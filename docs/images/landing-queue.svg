<title id="dtitle">Choros queue: landing sets for review and queued</title>
<desc id="ddesc">Time and dependency run left to right from main. For review: landing sets 1, 3, 5 and 6 at the front with PRs against main, and landing sets 2, 4 and 7 stacked on 1, 3 and 6 as GitHub stacks. Queued with no PR: landing sets 8 through 15. New changes start from the merge head and land at landing sets 9 and 11, each sequenced onto only what it needs.</desc>
