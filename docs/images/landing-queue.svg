.calc { stroke: #a9b1bf; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; }
.new-box { fill: #0d1117; stroke: #6b7383; stroke-width: 1.2; stroke-dasharray: 6 4; }
.halo{stroke:#0d1117;stroke-width:8;}
}
